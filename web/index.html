<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Lite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scanlines"></div>

<!-- SCREEN 1: WELCOME -->
<div class="screen active" id="screen-welcome">
  <div class="welcome-wrap">
    <div class="logo-area">
      <div class="logo-sprite">⚔️</div>
      <div class="logo-title">POKEMON<br>LITE</div>
      <div class="logo-sub">OOP EDITION</div>
    </div>
    <div class="legend">
      <span>Pick 3 Pokemon</span>
      <span>Choose 4 Moves Each</span>
      <span>Battle to Win</span>
    </div>
    <button class="btn-pixel btn-primary" id="btn-new-game">▶ NEW GAME</button>
  </div>
</div>

<!-- SCREEN 2: POKEMON SELECT -->
<div class="screen" id="screen-pokemon">
  <div class="screen-header">
    <div class="screen-title">SELECT YOUR TEAM</div>
    <div class="screen-sub" id="team-slot-label">Pick Pokemon 1 of 3</div>
    <div class="team-preview" id="team-preview"></div>
  </div>
  <div class="pokemon-grid" id="pokemon-grid"></div>
</div>

<!-- SCREEN 3: MOVE SELECT -->
<div class="screen" id="screen-moves">
  <div class="screen-header">
    <div class="screen-title">SELECT MOVES</div>
    <div class="screen-sub">Pick exactly 4 moves</div>
  </div>
  <div class="move-select-header" id="move-select-pokemon-info"></div>
  <div class="moves-grid" id="moves-grid"></div>
  <div class="move-confirm-bar">
    <span class="move-count-label" id="move-count-label">0 / 4 selected</span>
    <button class="btn-pixel btn-primary" id="btn-confirm-moves" disabled>CONFIRM ▶</button>
  </div>
</div>

<!-- SCREEN 4: BATTLE -->
<div class="screen" id="screen-battle">

  <div class="battle-arena">

    <!-- Enemy Fighter -->
    <div class="fighter-panel" id="enemy-panel">
      <div class="fighter-sprite enemy-sprite" id="enemy-sprite">❓</div>
      <div class="fighter-stats-block">
        <div class="fighter-name-row">
          <span class="fighter-name" id="enemy-name">---</span>
          <span class="type-badge"   id="enemy-type-badge"></span>
          <span class="status-badge" id="enemy-status-badge"></span>
        </div>
        <div class="hp-row">
          <span class="hp-label">HP</span>
          <div class="hp-track"><div class="hp-fill" id="enemy-hp-fill"></div></div>
          <span class="hp-text" id="enemy-hp-text">--- / ---</span>
        </div>
        <div class="stat-row">
          <span>ATK <b id="enemy-atk">--</b></span>
          <span>DEF <b id="enemy-def">--</b></span>
          <span>SPD <b id="enemy-spd">--</b></span>
        </div>
      </div>
    </div>

    <!-- Player Fighter -->
    <div class="fighter-panel" id="player-panel">
      <div class="fighter-sprite player-sprite" id="player-sprite">❓</div>
      <div class="fighter-stats-block">
        <div class="fighter-name-row">
          <span class="fighter-name" id="player-name">---</span>
          <span class="type-badge"   id="player-type-badge"></span>
          <span class="status-badge" id="player-status-badge"></span>
        </div>
        <div class="hp-row">
          <span class="hp-label">HP</span>
          <div class="hp-track"><div class="hp-fill" id="player-hp-fill"></div></div>
          <span class="hp-text" id="player-hp-text">--- / ---</span>
        </div>
        <div class="stat-row">
          <span>ATK <b id="player-atk">--</b></span>
          <span>DEF <b id="player-def">--</b></span>
          <span>SPD <b id="player-spd">--</b></span>
        </div>
      </div>
    </div>

    <!-- Enemy party dots -->
    <div class="enemy-party-bar" id="enemy-party-bar"></div>

  </div>

  <!-- Battle Log -->
  <div class="log-container">
    <div class="log-title">▸ BATTLE LOG</div>
    <div class="battle-log" id="battle-log"></div>
  </div>

  <!-- Move Buttons + Party Switch -->
  <div class="battle-bottom">
    <div class="move-buttons">
      <button class="move-btn" id="mbtn-0" data-index="0">—</button>
      <button class="move-btn" id="mbtn-1" data-index="1">—</button>
      <button class="move-btn" id="mbtn-2" data-index="2">—</button>
      <button class="move-btn" id="mbtn-3" data-index="3">—</button>
    </div>
    <div class="party-switch-panel">
      <div class="party-label">YOUR PARTY</div>
      <div class="party-slots" id="player-party-slots"></div>
    </div>
  </div>

  <!-- Game Over Overlay -->
  <div class="game-over-overlay hidden" id="game-over-overlay">
    <div class="game-over-box">
      <div class="go-icon"  id="go-icon">🏆</div>
      <div class="go-title" id="go-title">VICTORY!</div>
      <div class="go-sub"   id="go-sub"></div>
      <button class="btn-pixel btn-primary" id="btn-play-again">▶ PLAY AGAIN</button>
    </div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
